}

  --md-sys-color-primary: #c9d0ff; --md-sys-color-on-primary: #141a33;
  --md-sys-color-primary-container: #2a3150; --md-sys-color-on-primary-container: #e4e7f5;
  --md-sys-color-secondary: #9aa8ff; --md-sys-color-on-secondary: #141a33;
  --md-sys-color-secondary-container: #26306a; --md-sys-color-on-secondary-container: #dfe3ff;
  --md-sys-color-tertiary: #f0c47a; --md-sys-color-tertiary-container: #4a3714; --md-sys-color-on-tertiary-container: #fbe5bd;
  --md-sys-color-error: #ff8a80; --md-sys-color-error-container: #4c1d1d; --md-sys-color-on-error-container: #ffd9d4;
  --md-sys-color-background: #0b0d16;
  --md-sys-color-surface: #141827; --md-sys-color-on-surface: #e8eaf3; --md-sys-color-on-surface-variant: #a2a8bd;
  --md-sys-color-surface-container-lowest: #1a1f31; --md-sys-color-surface-container-low: #1e2337;
  --md-sys-color-surface-container: #23293e; --md-sys-color-surface-container-high: #2a3047;
  --md-sys-color-surface-container-highest: #323852;
  --md-sys-color-outline: #4a5170; --md-sys-color-outline-variant: #2d3349;
  --app-ok: #6fd3a3; --app-ok-container: #173327;
  --app-frame: linear-gradient(160deg, #121624 0%, #141a2c 55%, #1a1d3a 100%);
  --app-shadow: 0 30px 60px rgb(0 0 0 / .35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--md-sys-color-background); color: var(--md-sys-color-on-surface); font: var(--md-sys-typescale-body-medium); }
button { font: inherit; color: inherit; }
.ic { display: inline-flex; width: 20px; height: 20px; flex: none; }
.ic svg { width: 100%; height: 100%; }
.ic.sm { width: 16px; height: 16px; }
.mono { font-family: var(--app-mono); font-size: 12.5px; }
.muted { color: var(--md-sys-color-on-surface-variant); }
.grow { flex: 1; }
[hidden] { display: none !important; }

/* ---------- Frame ---------- */
.frame { margin: 16px; height: calc(100vh - 32px); border-radius: 34px; background: var(--app-frame);
  display: grid; grid-template-columns: 76px 292px minmax(0, 1fr); gap: 14px; padding: 14px; box-shadow: var(--app-shadow); overflow: hidden; }

.rail { display: flex; flex-direction: column; align-items: center; gap: 12px; padding-top: 6px; }
.logo { width: 52px; height: 52px; border-radius: 50%; background: var(--md-sys-color-primary); color: var(--md-sys-color-on-primary);
  display: grid; place-items: center; font-weight: 700; font-size: 15px; letter-spacing: .5px; margin-bottom: 14px; }
.rbtn { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; border: 0; cursor: pointer;
  background: var(--md-sys-color-surface-container-lowest); color: var(--md-sys-color-on-surface); box-shadow: 0 1px 2px rgb(20 26 46 / .05);
  transition: background var(--md-sys-motion-duration-short4) var(--md-sys-motion-easing-standard); }
.rbtn:hover { background: var(--md-sys-color-surface-container-high); }
.rbtn.on { background: var(--md-sys-color-primary); color: var(--md-sys-color-on-primary); }
.rail .spacer { flex: 1; }

/* ---------- Panel ---------- */
.panel { background: var(--app-card); border-radius: var(--app-r-card); padding: 22px 14px 16px; display: flex; flex-direction: column; gap: 4px;
  border: 1px solid var(--app-card-edge); overflow: auto; }
.panel h2 { font: 500 24px/1.2 var(--md-sys-typescale-font-brand); margin: 0 8px 2px; letter-spacing: -.01em; overflow-wrap: anywhere; }
.panel .sub { color: var(--md-sys-color-on-surface-variant); margin: 0 8px 12px; font-size: 13px; }
.search { display: flex; align-items: center; gap: 10px; background: var(--md-sys-color-surface-container-lowest); border-radius: 999px;
  padding: 0 14px; color: var(--md-sys-color-on-surface-variant); margin-bottom: 8px; }
.search input { border: 0; outline: 0; background: transparent; flex: 1; min-width: 0; padding: 11px 0; font: inherit; color: var(--md-sys-color-on-surface); }
.search kbd { font: 11px/1 var(--md-sys-typescale-font-plain); background: var(--md-sys-color-surface-container); padding: 4px 7px; border-radius: 8px; white-space: nowrap; }
.results { display: flex; flex-direction: column; gap: 2px; margin: 0 0 8px; max-height: 280px; overflow: auto; }
.results button { text-align: left; border: 0; background: var(--md-sys-color-surface-container-lowest); border-radius: 12px; padding: 8px 10px; cursor: pointer; }
.results button small { display: block; color: var(--md-sys-color-on-surface-variant); }
.navh { display: flex; align-items: center; gap: 10px; padding: 9px 8px; font-weight: 500; border: 0; background: transparent; border-radius: 12px; text-align: left; width: 100%; }
button.navh { cursor: pointer; } button.navh:hover { background: var(--md-sys-color-surface-container-lowest); }
.navh .ic { color: var(--md-sys-color-on-surface-variant); }
.count { margin-left: auto; font-size: 12px; font-weight: 600; background: var(--md-sys-color-surface-container-lowest); padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.count.warn { color: var(--md-sys-color-on-tertiary-container); background: var(--md-sys-color-tertiary-container); }
.count.off { color: var(--md-sys-color-on-surface-variant); background: var(--md-sys-color-surface-container); }
.dtree { border-left: 1.5px solid var(--md-sys-color-outline-variant); margin-left: 17px; padding-left: 6px; display: flex; flex-direction: column; gap: 2px; }
.ni { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 14px; color: var(--md-sys-color-on-surface-variant); cursor: pointer; border: 0; background: transparent; width: 100%; text-align: left; }
.ni:hover { background: color-mix(in srgb, var(--md-sys-color-surface-container-lowest) 60%, transparent); }
.ni .lt { width: 24px; height: 24px; border-radius: 8px; display: grid; place-items: center; font-size: 12px; font-weight: 700; flex: none;
  background: var(--md-sys-color-surface-container); color: var(--md-sys-color-on-surface); }
.ni.on { background: var(--md-sys-color-surface-container-lowest); color: var(--md-sys-color-on-surface); font-weight: 600; box-shadow: 0 1px 3px rgb(20 26 46 / .06); }
.ni.inactive { opacity: .55; }

/* ---------- Main ---------- */
.main { padding: 8px 12px 12px 6px; display: flex; flex-direction: column; gap: 16px; min-width: 0; overflow: auto; }
.crumb { color: var(--md-sys-color-on-surface-variant); font-size: 13px; display: flex; gap: 8px; align-items: center; }
.crumb b { color: var(--md-sys-color-on-surface); font-weight: 500; }
.head { display: flex; align-items: flex-end; gap: 24px; }
.head > div:first-child { flex: 1; min-width: 0; }
.title { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.title .badge { width: 54px; height: 54px; border-radius: 14px; background: var(--md-sys-color-primary); color: var(--md-sys-color-on-primary); display: grid; place-items: center; }
.title .badge .ic { width: 24px; height: 24px; }
.title h1 { margin: 0; font: 500 38px/1.1 var(--md-sys-typescale-font-brand); letter-spacing: -.02em; }
.lead { color: var(--md-sys-color-on-surface-variant); margin: 6px 0 0; font-size: 15px; max-width: 760px; }
.stats { margin-left: auto; display: flex; gap: 30px; align-items: flex-end; }
.stat small { display: block; color: var(--md-sys-color-on-surface-variant); font-size: 13px; margin-bottom: 4px; white-space: nowrap; }
.stat b { font: 500 32px/1 var(--md-sys-typescale-font-brand); letter-spacing: -.02em; }
.cta { display: inline-flex; align-items: center; gap: 10px; background: var(--md-sys-color-primary); color: var(--md-sys-color-on-primary); border: 0; border-radius: 999px;
  padding: 15px 24px; font: 500 16px/1 var(--md-sys-typescale-font-plain); cursor: pointer; white-space: nowrap; }
.cta:disabled { opacity: .4; cursor: default; }
.btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--md-sys-color-outline-variant); background: var(--md-sys-color-surface-container-lowest);
  color: var(--md-sys-color-on-surface); border-radius: 999px; padding: 8px 14px; font-size: 13px; cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--md-sys-color-surface-container); }
.btn:disabled { opacity: .4; cursor: default; background: var(--md-sys-color-surface-container-lowest); }
.btn.danger { color: var(--md-sys-color-error); }
.btn .ic { width: 16px; height: 16px; }
.iconbtn { border: 0; background: transparent; color: var(--md-sys-color-on-surface-variant); border-radius: 10px; padding: 5px; cursor: pointer; display: inline-grid; place-items: center; }
.iconbtn:hover { background: var(--md-sys-color-surface-container); color: var(--md-sys-color-on-surface); }
.iconbtn .ic { width: 16px; height: 16px; }

.pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 999px; font-size: 13px; font-weight: 500; white-space: nowrap; }
.pill .ic { width: 15px; height: 15px; }
.pill.err { background: var(--md-sys-color-error-container); color: var(--md-sys-color-error); }
.pill.ok { background: var(--app-ok-container); color: var(--app-ok); }
.pill.info { background: var(--md-sys-color-secondary-container); color: var(--md-sys-color-on-secondary-container); }
.pill.warn { background: var(--md-sys-color-tertiary-container); color: var(--md-sys-color-on-tertiary-container); }
.pill.mut { background: var(--md-sys-color-surface-container); color: var(--md-sys-color-on-surface-variant); }
.pill.sm { padding: 2px 8px; font-size: 11.5px; }

.card { background: var(--app-card); border-radius: var(--app-r-card); padding: 20px; border: 1px solid var(--app-card-edge); min-width: 0; }
.card > .ch { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 14px; }
.card h3 { margin: 0; font: 500 20px/1.25 var(--md-sys-typescale-font-brand); display: flex; align-items: center; gap: 8px; }
.card h3 .ic { color: var(--md-sys-color-secondary); }
.card .hint { margin: 3px 0 0; color: var(--md-sys-color-on-surface-variant); font-size: 13.5px; }
.card .ch .right { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.inner { background: var(--md-sys-color-surface-container-lowest); border-radius: var(--app-r-inner); padding: 14px 18px;
  --md-sys-color-surface: var(--md-sys-color-surface-container-lowest); }
.cols { display: grid; grid-template-columns: minmax(0, 1.9fr) minmax(300px, 1fr); gap: 16px; align-items: start; }
.cols.even { grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); }
.cols.side { grid-template-columns: minmax(0, 1fr) 360px; }
.stack { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
@media (max-width: 1280px) { .cols, .cols.even, .cols.side { grid-template-columns: minmax(0, 1fr); } }

/* Stepper */
.steps { display: grid; grid-template-columns: repeat(var(--n, 8), minmax(0, 1fr)); padding: 16px 20px; align-items: start; }
.step { position: relative; padding: 0 8px 0 0; cursor: pointer; border: 0; background: transparent; text-align: left; display: flex; flex-direction: column; align-items: flex-start; align-self: start; }
.step .node { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--md-sys-color-surface-container);
  color: var(--md-sys-color-on-surface-variant); position: relative; z-index: 1; font-weight: 600; font-size: 13px; }
.step .node .ic { width: 17px; height: 17px; }
.step::before { content: ""; position: absolute; left: 40px; right: 6px; top: 17px; height: 1.5px; background: var(--md-sys-color-outline-variant); }
.step:last-child::before { display: none; }
.step.done .node { background: var(--app-ok-container); color: var(--app-ok); }
.step.warn .node { background: var(--md-sys-color-tertiary-container); color: var(--md-sys-color-on-tertiary-container); }
.step.err .node { background: var(--md-sys-color-error-container); color: var(--md-sys-color-error); }
.step.cur .node { background: var(--md-sys-color-primary); color: var(--md-sys-color-on-primary); }
.step b { display: block; margin-top: 12px; font-weight: 500; font-size: 14.5px; }
.step.cur b { font-weight: 600; }
.step small { display: block; color: var(--md-sys-color-on-surface-variant); font-size: 12.5px; margin-top: 3px; }

/* Tables and compact inputs */
table.t { width: 100%; border-collapse: collapse; font-size: 13.5px; }
table.t th { text-align: left; font-weight: 500; color: var(--md-sys-color-on-surface-variant); font-size: 12.5px; padding: 6px 8px; white-space: nowrap; }
table.t td { padding: 5px 8px; border-top: 1px solid var(--md-sys-color-outline-variant); white-space: nowrap; vertical-align: middle; }
table.t td.wrap { white-space: normal; }
table.t .grp td { background: var(--md-sys-color-surface-container-low); border-top: 0; padding: 8px; font-weight: 600; }
table.t .grp td:first-child { border-radius: 12px 0 0 12px; } table.t .grp td:last-child { border-radius: 0 12px 12px 0; }
table.t tr.drop-before td { box-shadow: inset 0 2px 0 var(--md-sys-color-secondary); }
table.t tr.dragging td { opacity: .45; }
.grip { color: var(--md-sys-color-outline); width: 18px; cursor: grab; }
.grip .ic { width: 16px; height: 16px; }
.cell { width: 100%; min-width: 48px; border: 1px solid transparent; background: transparent; border-radius: 8px; padding: 6px 8px; font: inherit; color: inherit; outline: 0; }
.cell:hover { border-color: var(--md-sys-color-outline-variant); }
.cell:focus { border-color: var(--md-sys-color-secondary); background: var(--md-sys-color-surface-container-lowest); }
.cell.mono { font-family: var(--app-mono); font-size: 12.5px; }
.cell.code { width: 64px; font-weight: 600; text-transform: uppercase; }
.cell.num { width: 76px; }
.cell.wide { min-width: 200px; }
.cell.mid { min-width: 130px; }
.cell::placeholder { color: var(--md-sys-color-outline); }
.cell.bad { border-color: var(--md-sys-color-error); }
select.cell { appearance: none; padding-right: 22px; background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
  background-position: calc(100% - 12px) 50%, calc(100% - 8px) 50%; background-size: 4px 4px; background-repeat: no-repeat; cursor: pointer; }
.badge-code { display: inline-grid; place-items: center; min-width: 30px; padding: 2px 6px; border-radius: 8px; background: var(--md-sys-color-surface-container); font-weight: 600; font-size: 12.5px; }
.fn { white-space: nowrap; display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--md-sys-color-secondary-container); color: var(--md-sys-color-on-secondary-container); }
.slotbar { display: inline-flex; gap: 2px; vertical-align: middle; margin-left: 8px; }
.slotbar i { width: 7px; height: 12px; border-radius: 2px; background: var(--md-sys-color-surface-container-highest); }
.slotbar i.f { background: var(--md-sys-color-secondary); } .slotbar i.x { background: var(--md-sys-color-error); }
.addrow td { border-top: 1px dashed var(--md-sys-color-outline) !important; }
.addrow button { border: 0; background: transparent; color: var(--md-sys-color-on-surface-variant); display: inline-flex; gap: 6px; align-items: center; cursor: pointer; padding: 4px 0; }
.addrow button:hover { color: var(--md-sys-color-on-surface); }
.tablewrap { overflow-x: auto; }

/* Forms */
.form { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px 16px; }
.form md-text-field { width: 100%; min-width: 0; }
.form .full { grid-column: 1 / -1; }
.field-ex { font-size: 12.5px; color: var(--md-sys-color-on-surface-variant); margin-top: 4px; padding-left: 4px; }
.field-ex .mono { color: var(--md-sys-color-on-surface); }
.row { display: flex; align-items: center; gap: 12px; }
.opt { display: flex; align-items: center; gap: 12px; padding: 10px 4px; border-top: 1px solid var(--md-sys-color-outline-variant); }
.opt:first-child { border-top: 0; }
.opt small { display: block; color: var(--md-sys-color-on-surface-variant); }
.section-label { font-size: 13px; color: var(--md-sys-color-on-surface-variant); margin: 16px 0 8px; }
.section-label:first-child { margin-top: 0; }
textarea.paste { width: 100%; min-height: 120px; border: 1px solid var(--md-sys-color-outline-variant); border-radius: 12px; padding: 10px 12px;
  font: 12.5px/1.5 var(--app-mono); background: var(--md-sys-color-surface-container-lowest); color: var(--md-sys-color-on-surface); resize: vertical; outline: 0; }
textarea.paste:focus { border-color: var(--md-sys-color-secondary); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
md-chip { white-space: nowrap; }

/* Intelligence list (issues, checks) */
.intel { display: flex; flex-direction: column; }
.it { display: grid; grid-template-columns: 38px 1fr; gap: 12px; padding: 12px 0; border-top: 1px solid var(--md-sys-color-outline-variant); }
.it:first-child { border-top: 0; padding-top: 2px; }
.it.link { cursor: pointer; } .it.link:hover b { text-decoration: underline; }
.it .ib { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; }
.it .ib .ic { width: 19px; height: 19px; }
.it b { font-weight: 500; font-size: 14px; }
.it p { margin: 4px 0 0; color: var(--md-sys-color-on-surface-variant); font-size: 13px; line-height: 1.45; }
.ib.err { background: var(--md-sys-color-error-container); color: var(--md-sys-color-error); }
.ib.warn { background: var(--md-sys-color-tertiary-container); color: var(--md-sys-color-on-tertiary-container); }
.ib.info { background: var(--md-sys-color-secondary-container); color: var(--md-sys-color-on-secondary-container); }
.ib.ok { background: var(--app-ok-container); color: var(--app-ok); }
.fact { display: inline-flex; align-items: center; font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px;
  background: var(--md-sys-color-secondary-container); color: var(--md-sys-color-on-secondary-container); margin-left: 6px; vertical-align: 1px; white-space: nowrap; }
.empty { text-align: center; color: var(--md-sys-color-on-surface-variant); padding: 28px 12px; }
.empty b { display: block; color: var(--md-sys-color-on-surface); font-size: 16px; margin-bottom: 6px; }

/* Preview */
.explorer { font: 13px/1.9 var(--app-mono); max-height: 640px; overflow: auto; }
.explorer .er { display: flex; align-items: center; gap: 8px; padding: 0 6px; border-radius: 8px; white-space: nowrap; }
.explorer .er:hover { background: var(--md-sys-color-surface-container-low); }
.explorer .sep { color: var(--md-sys-color-on-surface-variant); }
.explorer .meta { margin-left: auto; display: flex; gap: 10px; color: var(--md-sys-color-on-surface-variant); font-size: 11.5px; }
.explorer .zc { color: var(--md-sys-color-secondary); }
.explorer .ind { color: var(--md-sys-color-outline); }
.ftabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.ftab { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--md-sys-color-outline-variant); background: var(--md-sys-color-surface-container-lowest);
  color: var(--md-sys-color-on-surface-variant); border-radius: 999px; padding: 7px 12px; font-size: 12.5px; cursor: pointer; white-space: nowrap; }
.ftab .ic { width: 15px; height: 15px; }
.ftab.on { background: var(--md-sys-color-primary); color: var(--md-sys-color-on-primary); border-color: var(--md-sys-color-primary); }
pre.src { margin: 0; font: 12.5px/1.65 var(--app-mono); max-height: 600px; overflow: auto; white-space: pre; }
pre.src .c { color: var(--md-sys-color-on-surface-variant); }
pre.src .k { color: var(--md-sys-color-secondary); font-weight: 600; }
pre.src .ln { display: inline-block; width: 42px; color: var(--md-sys-color-outline); user-select: none; }
table.sheet { border-collapse: collapse; font-size: 12px; }
table.sheet td { padding: 5px 10px; border-bottom: 1px solid var(--md-sys-color-outline-variant); white-space: pre-line; vertical-align: top; max-width: 360px; }
table.sheet td.n { color: var(--md-sys-color-on-surface-variant); text-align: right; }
table.sheet tr.header td { font-weight: 600; background: var(--md-sys-color-surface-container-low); }
table.sheet tr.title td, table.sheet tr.section td { font-weight: 600; }

/* Generate */
.sumgrid { display: grid; grid-template-columns: repeat(3, 1fr); }
.sumgrid > div { padding: 4px 16px; border-left: 1px solid var(--md-sys-color-outline-variant); }
.sumgrid > div:first-child { border-left: 0; padding-left: 0; }
.sumgrid small { color: var(--md-sys-color-on-surface-variant); font-size: 13px; }
.sumgrid b { display: block; font: 500 28px/1.2 var(--md-sys-typescale-font-brand); margin-top: 4px; }
.sumgrid span { font-size: 12.5px; color: var(--md-sys-color-on-surface-variant); }
.alert { display: flex; gap: 10px; align-items: center; padding: 12px 16px; border-radius: 14px; font-size: 14px; margin: 12px 0; }
.alert .ic { width: 20px; height: 20px; }
.alert.ok { background: var(--app-ok-container); color: var(--app-ok); }
.alert.err { background: var(--md-sys-color-error-container); color: var(--md-sys-color-error); }
.alert.warn { background: var(--md-sys-color-tertiary-container); color: var(--md-sys-color-on-tertiary-container); }
.alert.info { background: var(--md-sys-color-secondary-container); color: var(--md-sys-color-on-secondary-container); }
.out { display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--md-sys-color-outline-variant); }
.out:first-child { border-top: 0; }
.out .fi { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; background: var(--md-sys-color-surface-container); }
.out .fi .ic { width: 22px; height: 22px; }

  /* ================================================================
     md-segmented-button — connected multi/single select
     Usage: <md-segmented-button><button data-value="a">A</button>...</md-segmented-button>
     ================================================================ */
  class MdSegmentedButton extends HTMLElement {
    connectedCallback() {
      const multi = this.hasAttribute('multi');
      const items = [...this.querySelectorAll('button')];
      const root = this.attachShadow({ mode: 'open' });
      root.innerHTML = `
        <style>
          :host{ display:inline-flex; }
          .seg{ display:inline-flex; border-radius:var(--md-sys-shape-corner-full); overflow:hidden;
            border:1px solid var(--md-sys-color-outline); }
          ::slotted(button){ appearance:none; border:none; background:transparent; cursor:pointer;
            padding:10px 16px; min-height:40px; color:var(--md-sys-color-on-surface);
            font:var(--md-sys-typescale-label-large); border-left:1px solid var(--md-sys-color-outline);
            transition:background ${EASE_STD}; }
          ::slotted(button:first-child){ border-left:none; }
          ::slotted(button[selected]){ background:var(--md-sys-color-secondary-container);
            color:var(--md-sys-color-on-secondary-container); }
        </style>
        <div class="seg"><slot></slot></div>`;
      items.forEach(btn => btn.addEventListener('click', () => {
        if (!multi) items.forEach(b => b.removeAttribute('selected'));
        btn.toggleAttribute('selected');
        this.dispatchEvent(new CustomEvent('change', { detail: { value: btn.dataset.value, selected: btn.hasAttribute('selected') } }));
      }));
    }
  }
  define('md-segmented-button', MdSegmentedButton);

  /* Helper to wire a button to open a menu anchored below it. */
  window.MD3Menu = {
    attach(anchorEl, menuEl) {
      anchorEl.addEventListener('click', e => {
        e.stopPropagation();
        const r = anchorEl.getBoundingClientRect();
        menuEl.style.position = 'fixed';
        menuEl.style.top = r.bottom + 4 + 'px';
        menuEl.style.left = r.left + 'px';
        menuEl.show();
        const closer = () => { menuEl.close(); document.removeEventListener('click', closer); };
        setTimeout(() => document.addEventListener('click', closer), 0);
      });
    },
  };
})();

<script>/* core/util.js */
/* Shared helpers. Every src file registers itself on the global E3D namespace
   (classic scripts, no ES modules: file:// pages cannot load modules). */
(function (E3D) {
  'use strict';

  // Replace {KEY} placeholders. Unknown keys are kept verbatim and reported via `missing`.
  function fmt(template, vars, missing) {
    return String(template).replace(/\{([A-Za-z_]+)\}/g, function (m, key) {
      if (Object.prototype.hasOwnProperty.call(vars, key)) return String(vars[key]);
      if (missing) missing.push(key);
      return m;
    });
  }

  function placeholders(template) {
    var out = [], re = /\{([A-Za-z_]+)\}/g, m;
    while ((m = re.exec(String(template)))) out.push(m[1]);
    return out;
  }

  function clone(x) { return JSON.parse(JSON.stringify(x)); }

  function countBy(list, keyFn) {
    var map = new Map();
    list.forEach(function (x) { var k = keyFn(x); map.set(k, (map.get(k) || 0) + 1); });
    return map;
  }

  // Collapse runs of whitespace and trim ("as received, spaces trimmed" in the ZRF register).
  function squash(s) { return String(s == null ? '' : s).replace(/\s+/g, ' ').trim(); }

  E3D.util = { fmt: fmt, placeholders: placeholders, clone: clone, countBy: countBy, squash: squash };
})(globalThis.E3D || (globalThis.E3D = {}));

<script>/* core/model.js */
/* Configuration model: schema version, defaults, migration and structural checks.
   A config is plain JSON; everything project-specific lives in it (see presets/). */
(function (E3D) {
  'use strict';

  var SCHEMA_VERSION = 1;

  // Shape of a v1 config. Values here are neutral defaults, not ZRF data.
  function blank() {
    return {
      schemaVersion: SCHEMA_VERSION,
      project: { code: '', name: '', mdb: '', packageName: '' },
      formats: {
        teamDesc: 'TEAM FOR {DISCIPLINE} {PROJECT}',
        dbDesc: 'DB for {Discipline} - {ITEM}',
        dbName: '{TEAM}/DESI-{D}-{CODE}{F}',
        siteName: '/{D}-{CODE}{F}',
        sepDiscipline: '/----{DISCIPLINE}----',
        sepGroup: '/{D}----{GROUP}----'
      },
      separators: { discipline: true, group: true },
      dbNumber: { base: 10000, disciplineStep: 100, groupCapacity: 10 },
      dbAttributes: { type: 'DESI', access: 'MULTIWRITE', claim: 'IMPLICIT' },
      // zones: 'discipline' = the discipline's own zone list, otherwise a key of zoneSets.
      // zoneStatus: optional register status that replaces the zone's own status for this function.
      functions: [],
      zoneSets: {},
      pendingZone: { zone: '(not defined)', purpose: '', docRef: '', status: 'PENDING' },
      codeLists: {},
      disciplines: [],
      groups: [],
      items: [],
      references: [],
      existing: { dbs: [], sites: [] },
      users: { adminTeam: { team: '', label: 'Administration', description: '', exists: true, members: [] }, freeUsers: [] },
      texts: defaultTexts(),
      register: defaultRegister()
    };
  }

  // Register workbook: ordered sheet list. Generated kinds: packageFiles, teams, dbRegister,
  // siteOrder, zones, codeList (list: key of codeLists). kind 'text' = free rows { r, cells, role }.
  function defaultRegister() {
    return {
      sheets: [
        { kind: 'packageFiles', name: 'Package Files', title: '{PACKAGE}.zip - file list',
          header: ['No', 'Folder', 'File', 'Module', 'Step', 'Content'] },
        { kind: 'teams', name: 'Teams & Users', title: '{PROJECTCODE} - TEAMS & USERS',
          header: ['Team', 'Disc', 'Discipline', 'Description', 'DBs', 'Status', 'Members'], notes: [] },
        { kind: 'dbRegister', name: '{PROJECTCODE} DB Register',
          header: ['No', 'Discipline', 'Disc Code', 'Team', 'Module/Item', 'Mod Code', 'Func', 'Function', 'DB Name',
            'Description', 'DB No', 'File No', 'Type', 'Access', 'Claim', 'Site Name', 'Status'] },
        { kind: 'siteOrder', name: 'Site Order',
          header: ['Order', 'Discipline', 'Type', 'Site Name', 'Site Description', 'Created in DB', 'DB No', 'Group'] },
        { kind: 'zones', name: 'Zones', title: '{PROJECTCODE} - Zone Register',
          header: ['No', 'Discipline', 'Disc', 'Site', 'Zone Name', 'Purpose', 'Doc ref', 'Status'] },
        { kind: 'codeList', list: 'fluid', name: 'Fluid Codes', title: 'Fluid Codes',
          header: ['No', 'Code', 'Description', 'Zone pattern', 'Check'] }
      ],
      labels: {
        fileNo: 'System', teamCreated: 'Created', teamToCreate: 'To create', none: '—',
        freeUsersRow: 'FREE USERS - no team needed, can edit all {PROJECTCODE} DBs',
        siteTypes: { sepDiscipline: 'Separator - discipline', sepGroup: 'Separator - group', site: 'Site' }
      },
      packageFiles: {
        readme: { module: '—', step: '—', content: 'Package order + preparation' },
        teams: { module: 'Admin', step: '0', content: '{N_NEW_TEAMS} new teams (+ commented block for existing teams/members)' },
        b1: { module: 'Admin', step: 'B1', content: 'CREATE {N_DB} DBs + ADD to {MDBNAME} (pos {POS_FROM}-{POS_TO})' },
        b2: { module: 'Design', step: 'B2', content: '{N_SEP} separators + {N_SITES} sites (display order)' },
        b3: { module: 'Design', step: 'B3', content: '{N_ZONES} zones' },
        ref: { module: 'Admin', step: '90', content: 'reference DBs, pos {POS_FROM}-{POS_TO}' },
        fix: { module: 'Admin', step: '99', content: 'CURRENT {POS_FROM}-{POS_TO} (only if needed)' }
      }
    };
  }

  // Package file names and macro/README texts. Header lines get a "$* " prefix
  // ("$*" alone for an empty line). Neutral defaults; presets carry their own wording.
  function defaultTexts() {
    var BANNER = '===========================================================';
    return {
      files: {
        readme: '00-README.txt',
        teamsDir: '00-TEAMS', teams: '{PROJECTCODE}-00-TEAMS-ADMIN.mac',
        discDir: '{NN}-{D}-{TEAM}',
        b1: '{PROJECTCODE}-{NN}-{D}-B1-CREATE-DB-MDB-ADMIN.mac',
        b2: '{PROJECTCODE}-{NN}-{D}-B2-SITES-DESIGN.mac',
        b3: '{PROJECTCODE}-{NN}-{D}-B3-ZONES-DESIGN.mac',
        refDir: '90-REFERENCE', ref: '{PROJECTCODE}-90-REF-MDB-ADMIN.mac',
        fixDir: '99-FIXUP', fix: '{PROJECTCODE}-99-MDB-REORDER-ADMIN.mac',
        register: '{PROJECTCODE}-E3D-Register.xlsx'
      },
      readme: [
        '{PROJECTCODE} ({PROJECT}) - E3D SETUP PACKAGE',
        'Generated {DATE}. Full guide: {REGISTER}, sheet \'Setup Steps\'.',
        '',
        'STEPS (command macros only)',
        ' {TEAMSDIR} -> per discipline: B1 (Admin) -> B2 sites (Design) -> B3 zones (Design)',
        '',
        'ORDER: disciplines {FIRST} -> {LAST} (MDB positions follow on), then {REFDIR}.',
        'Admin steps before Design steps; re-enter DESIGN after each Admin step.',
        '{FIXDIR} only if the MDB order is wrong.',
        '{UNTESTED}'
      ].join('\n'),
      untested: 'PERLU DITES (not verified yet): {ITEMS}',
      headers: {
        teams: [BANNER, '{PROJECTCODE} - STEP 0 - TEAMS - ADMIN (SYSTEM)', 'Run once, before discipline {FIRST}.', BANNER, ''].join('\n'),
        b1: [BANNER, '{DISCIPLINE} ({TEAM}) - STEP B1 - ADMIN: CREATE {N} DB + MDB', 'Team must exist ({TEAMSDIR}).',
          'MDB positions {POS_FROM}-{POS_TO}: run disciplines in order {FIRST}->{LAST} (positions follow on).', BANNER, ''].join('\n'),
        b2: [BANNER, '{DISCIPLINE} - STEP B2 - DESIGN: separators + {N} sites (display order)',
          'DB given once per DB (first site); next lines without DB go to the same DB.', 'Re-enter DESIGN after B1.', BANNER, ''].join('\n'),
        b3: [BANNER, '{DISCIPLINE} - STEP B3 - DESIGN: zones', 'Each block: go to SITE, NEW ZONE.', BANNER, ''].join('\n'),
        ref: [BANNER, 'REFERENCE DBs - ADMIN: add to {MDBNAME}', 'Run AFTER all {N_DISC} disciplines (positions {POS_FROM}+).', BANNER, ''].join('\n'),
        fix: [BANNER, '{MDBNAME} FIX-UP - ADMIN: CURRENT db n for all (final order)',
          'Use only if the MDB order is wrong (e.g. disciplines run out of order).', BANNER, ''].join('\n')
      },
      teamsNew: '--- {N} new discipline teams ---',
      teamsExisting: '--- only if the existing {PROJECTCODE} teams were deleted (normally keep) ---',
      pendingLine: '{LINE}   <- {NOTE}',
      fixReferenceLabel: 'reference'
    };
  }

  // Templates for list entries, used to fill missing optional fields.
  var ENTRY = {
    functions: { letter: '', name: '', zones: 'discipline', zoneStatus: '' },
    disciplines: { letter: '', name: '', order: 0, team: '', teamExists: false, teamDescExisting: '',
      members: [], active: true, items: null, zones: [] },
    zone: { suffix: '', purpose: '', docRef: '', status: '', forEach: '' },
    groups: { name: '', slotBase: 0, separator: true },   // separator: per-group switch (global: separators.group)
    items: { code: '', label: '', desc: '', group: '', func: '', note: '' },
    references: { db: '', pending: false, note: '' },
    codeItem: { code: '', desc: '', note: '' }
  };

  // Ordered migrations: MIGRATIONS[n] upgrades a version-n config to n+1.
  var MIGRATIONS = {};

  function isObj(x) { return x !== null && typeof x === 'object' && !Array.isArray(x); }

  function fill(target, defaults) {
    Object.keys(defaults).forEach(function (k) {
      if (!(k in target) || target[k] === undefined) target[k] = E3D.util.clone(defaults[k]);
      else if (isObj(defaults[k]) && isObj(target[k]) && Object.keys(defaults[k]).length) fill(target[k], defaults[k]);
    });
    return target;
  }

  // Upgrade any supported config to the current schema and fill missing optional fields.
  // Throws on configs that cannot be read (no version, or written by a newer tool).
  function migrate(input) {
    if (!isObj(input)) throw new Error('Config bukan objek JSON.');
    var cfg = E3D.util.clone(input);
    var v = cfg.schemaVersion;
    if (typeof v !== 'number') throw new Error('Config tidak punya schemaVersion.');
    if (v > SCHEMA_VERSION) throw new Error('Config dibuat oleh versi tool yang lebih baru (schema ' + v + ').');
    while (v < SCHEMA_VERSION) {
      if (!MIGRATIONS[v]) throw new Error('Tidak ada migrasi dari schema ' + v + '.');
      cfg = MIGRATIONS[v](cfg);
      v = cfg.schemaVersion;
    }
    fill(cfg, blank());
    cfg.functions.forEach(function (f) { fill(f, ENTRY.functions); });
    cfg.disciplines.forEach(function (d) {
      fill(d, ENTRY.disciplines);
      d.zones.forEach(function (z) { fill(z, ENTRY.zone); });
    });
    Object.keys(cfg.zoneSets).forEach(function (k) {
      fill(cfg.zoneSets[k], { name: k, zones: [] });
      cfg.zoneSets[k].zones.forEach(function (z) { fill(z, ENTRY.zone); });
    });
    Object.keys(cfg.codeLists).forEach(function (k) {
      fill(cfg.codeLists[k], { name: k, items: [] });
      cfg.codeLists[k].items.forEach(function (c) { fill(c, ENTRY.codeItem); });
    });
    cfg.groups.forEach(function (g) { fill(g, ENTRY.groups); });
    cfg.items.forEach(function (i) { fill(i, ENTRY.items); });
    cfg.references.forEach(function (r) { fill(r, ENTRY.references); });
    return cfg;
  }

  // Structural problems that make derivation meaningless (wrong types, dangling keys).
  function checkStructure(cfg) {
    var out = [];
    function err(path, msg) { out.push({ level: 'error', code: 'structure', fact: '', path: path, msg: msg }); }
    ['functions', 'disciplines', 'groups', 'items', 'references'].forEach(function (k) {
      if (!Array.isArray(cfg[k])) err(k, k + ' harus berupa list.');
    });
    if (out.length) return out;
    var funcs = new Set(cfg.functions.map(function (f) { return f.letter; }));
    var groups = new Set(cfg.groups.map(function (g) { return g.name; }));
    cfg.functions.forEach(function (f, i) {
      if (f.zones !== 'discipline' && !cfg.zoneSets[f.zones])
        err('functions.' + i + '.zones', 'Function ' + f.letter + ': zone set "' + f.zones + '" tidak ada.');
    });
    cfg.items.forEach(function (it, i) {
      if (!groups.has(it.group)) err('items.' + i + '.group', 'Item ' + it.code + ': grup "' + it.group + '" tidak ada.');
      if (!funcs.has(it.func)) err('items.' + i + '.func', 'Item ' + it.code + ': function "' + it.func + '" tidak ada.');
    });
    cfg.disciplines.forEach(function (d, i) {
      if (typeof d.order !== 'number') err('disciplines.' + i + '.order', 'Disiplin ' + d.letter + ': urutan harus angka.');
      d.zones.forEach(function (z, j) {
        if (z.forEach && !cfg.codeLists[z.forEach])
          err('disciplines.' + i + '.zones.' + j, 'Disiplin ' + d.letter + ': code list "' + z.forEach + '" tidak ada.');
      });
    });

  }

  E3D.model = { SCHEMA_VERSION: SCHEMA_VERSION, blank: blank, migrate: migrate, checkStructure: checkStructure };
})(globalThis.E3D || (globalThis.E3D = {}));

<script>/* core/derive.js */
/* Pure derivation: config -> DBs, site order, zones and MDB positions.
   No DOM, no I/O. Everything the macros and the register print comes from here. */
(function (E3D) {
  'use strict';
  var fmt = E3D.util.fmt;

  // Items of a discipline in register order (config.items order, optionally filtered).
  function itemsFor(cfg, disc) {
    if (!Array.isArray(disc.items)) return cfg.items.slice();
    var keep = new Set(disc.items);
    return cfg.items.filter(function (it) { return keep.has(it.code); });
  }

  // Display order = register order stably sorted by group order (PLAN T1).
  function displayOrder(cfg, items) {
    var rank = new Map(cfg.groups.map(function (g, i) { return [g.name, i]; }));
    return items.map(function (it, i) { return { it: it, i: i }; })
      .sort(function (a, b) { return (rank.get(a.it.group) - rank.get(b.it.group)) || (a.i - b.i); })
      .map(function (x) { return x.it; });
  }

  function zonesOf(cfg, disc, func) {
    var spec = func && func.zones !== 'discipline' ? (cfg.zoneSets[func.zones] || { zones: [] }).zones : disc.zones;
    var out = [];
    spec.forEach(function (z) {
      if (!z.forEach) { out.push(z); return; }
      var list = cfg.codeLists[z.forEach];
      (list ? list.items : []).forEach(function (c) {
        var v = { CODE: c.code, DESC: c.desc };
        out.push({ suffix: fmt(z.suffix, v), purpose: fmt(z.purpose, v), docRef: z.docRef, status: z.status });
      });
    });
    if (func && func.zoneStatus) out = out.map(function (z) { return Object.assign({}, z, { status: func.zoneStatus }); });
    return out;
  }

  function derive(cfg) {
    var funcs = new Map(cfg.functions.map(function (f) { return [f.letter, f]; }));
    var groups = new Map(cfg.groups.map(function (g) { return [g.name, g]; }));
    var missing = [];
    var discs = cfg.disciplines.filter(function (d) { return d.active; });
    var mdbPos = 0;

    var out = discs.map(function (disc, di) {
      var v0 = { TEAM: disc.team, D: disc.letter, DISCIPLINE: disc.name.toUpperCase(), Discipline: disc.name,
        PROJECT: cfg.project.name, PROJECTCODE: cfg.project.code };
      var regItems = itemsFor(cfg, disc);
      var rankInGroup = new Map(), dbs = new Map();

      displayOrder(cfg, regItems).forEach(function (it) {
        var g = groups.get(it.group) || { name: it.group, slotBase: 0 };
        var f = funcs.get(it.func) || { letter: it.func, name: it.func, zones: 'discipline' };
        var rank = rankInGroup.get(g.name) || 0;
        rankInGroup.set(g.name, rank + 1);
        var v = Object.assign({}, v0, { CODE: it.code, F: it.func, GROUP: g.name, ITEM: it.desc });
        var slot = g.slotBase + rank;
        dbs.set(it, {
          disc: disc, item: it, group: g, func: f, rankInGroup: rank, slot: slot,
          dbno: cfg.dbNumber.base + disc.order * cfg.dbNumber.disciplineStep + slot,
          db: fmt(cfg.formats.dbName, v, missing),
          site: fmt(cfg.formats.siteName, v, missing),
          desc: fmt(cfg.formats.dbDesc, v, missing),
          mdbPos: ++mdbPos
        });
      });

      var display = displayOrder(cfg, regItems).map(function (it) { return dbs.get(it); });

      // Site order: separators sit in the DB of the first site they precede (facts 3.3, 3.4).
      var siteOrder = [], lastGroup = null;
      display.forEach(function (row, i) {
        if (i === 0 && cfg.separators.discipline)
          siteOrder.push({ type: 'sepDiscipline', name: fmt(cfg.formats.sepDiscipline, v0, missing), row: row, group: '' });
        if (row.group.name !== lastGroup && cfg.separators.group && row.group.separator !== false)
          siteOrder.push({ type: 'sepGroup', name: fmt(cfg.formats.sepGroup, Object.assign({}, v0, { GROUP: row.group.name }), missing),
            row: row, group: row.group.name });
        lastGroup = row.group.name;
        siteOrder.push({ type: 'site', name: row.site, row: row, group: row.group.name });
      });

      var zones = [];
      display.forEach(function (row) {
        var list = zonesOf(cfg, disc, row.func);
        if (!list.length) zones.push({ row: row, pending: true });
        list.forEach(function (z) {
          zones.push({ row: row, pending: false, name: row.site + z.suffix, suffix: z.suffix,
            purpose: z.purpose, docRef: z.docRef, status: z.status });
        });
      });

      return {
        disc: disc, index: di,
        teamDesc: fmt(cfg.formats.teamDesc, v0, missing),
        register: regItems.map(function (it) { return dbs.get(it); }),
        display: display, siteOrder: siteOrder, zones: zones,
        pending: disc.zones.length === 0
      };
    });

    var refs = cfg.references.map(function (r) {
      return { ref: r, db: r.db, pending: !!r.pending, note: r.note, mdbPos: r.pending ? null : ++mdbPos };
    });

    return {
      disciplines: out,
      dbs: [].concat.apply([], out.map(function (d) { return d.display; })),
      references: refs,
      mdbCount: mdbPos,
      missingPlaceholders: Array.from(new Set(missing))
    };
  }

  E3D.derive = derive;
  E3D.deriveHelpers = { itemsFor: itemsFor, displayOrder: displayOrder, zonesOf: zonesOf };
})(globalThis.E3D || (globalThis.E3D = {}));

</script>
<script>/* core/validate.js */
/* Validation. E3D rules come only from docs/fakta-terverifikasi-e3d-admin.md;
   `fact` holds the fact number. Rules with fact '' are tool/project rules, not E3D rules. */
(function (E3D) {
  'use strict';

  var LIMITS = {
    dbnoRanges: [[1, 7000], [10000, 250000]],   // fact 1.3
    mdbPosMax: 5000,                            // fact 1.7, §2 ADD/CURRENT
    currentMax: 1000                            // fact 1.7
  };
  var SAFE_NAME = /^\/[A-Z0-9-]*$/;             // other characters: untested (fact §9)

  function validate(cfg, derived) {
    var out = [];
    function add(level, code, fact, msg, path) { out.push({ level: level, code: code, fact: fact, msg: msg, path: path || '' }); }

    E3D.model.checkStructure(cfg).forEach(function (x) { out.push(x); });
    if (out.length) return out;
    var d = derived || E3D.derive(cfg);

    d.missingPlaceholders.forEach(function (k) {
      add('error', 'placeholder', '', 'Placeholder {' + k + '} tidak dikenal di salah satu format nama.', 'formats');
    });

    if (!cfg.project.mdb) add('error', 'mdb-missing', '§2', 'Nama MDB kosong; SET MDB butuh nama.', 'project.mdb');
    else checkName(cfg.project.mdb, 'MDB', 'project.mdb');

    // DB numbers and names
    var byNo = new Map(), byName = new Map();
    d.dbs.forEach(function (r) {
      var inRange = LIMITS.dbnoRanges.some(function (rg) { return r.dbno >= rg[0] && r.dbno <= rg[1]; });
      if (!inRange) add('error', 'dbno-range', '1.3', r.db + ': DB No ' + r.dbno + ' di luar rentang 1–7000 / 10000–250000.', dbPath(r));
      push(byNo, r.dbno, r); push(byName, r.db, r);
    });
    byNo.forEach(function (rows, no) {
      if (rows.length > 1) add('error', 'dbno-dup', '1.3', 'DB No ' + no + ' dipakai ' + rows.length + ' DB: ' + names(rows) + '.', dbPath(rows[0]));
    });
    byName.forEach(function (rows, name) {
      if (rows.length > 1) add('error', 'dbname-dup', '6.11', 'Nama DB ' + name + ' muncul ' + rows.length + ' kali.', dbPath(rows[0]));
    });

    // Clash with existing DBs / sites
    var exNo = new Map(), exName = new Map(), exSite = new Map();
    cfg.existing.dbs.forEach(function (x) {
      if (x.dbno !== '' && x.dbno != null) exNo.set(Number(x.dbno), x);
      exName.set(String(x.name).toUpperCase(), x);
    });
    cfg.existing.sites.forEach(function (x) { exSite.set(String(x.name), x); });
    d.dbs.forEach(function (r) {
      var a = exNo.get(r.dbno);
      if (a) add('error', 'dbno-clash', '1.3', r.db + ': DB No ' + r.dbno + ' sudah dipakai ' + a.name + src(a) + '.', dbPath(r));
      var b = exName.get(r.db.toUpperCase());
      if (b) add('error', 'dbname-clash', '6.11', r.db + ': nama DB sudah ada' + src(b) + '.', dbPath(r));
    });

    // Site, separator and zone names
    var siteNames = new Map();
    d.disciplines.forEach(function (dd) {
      dd.siteOrder.forEach(function (s) {
        push(siteNames, s.name, s);
        checkName(s.name, 'Site', 'disciplines.' + cfg.disciplines.indexOf(dd.disc));
        if (exSite.has(s.name)) add('warning', 'site-clash', '§7', 'Site ' + s.name + ' sudah ada' + src(exSite.get(s.name)) + ' (error 41,12 Name already used).', 'existing.sites');
      });
      var zseen = new Set();
      dd.zones.forEach(function (z) {
        if (z.pending) return;
        if (!zseen.has(z.suffix)) { zseen.add(z.suffix); checkName(z.name, 'Zone', 'disciplines.' + cfg.disciplines.indexOf(dd.disc) + '.zones'); }
      });
    });
    siteNames.forEach(function (rows, name) {
      if (rows.length > 1) add('warning', 'site-dup', '§7', 'Nama site ' + name + ' muncul ' + rows.length + ' kali (error 41,12 Name already used).', '');
    });

    // MDB limits
    var maxPos = d.mdbCount;
    if (maxPos > LIMITS.mdbPosMax) add('error', 'mdb-pos', '1.7', 'Posisi MDB sampai ' + maxPos + '; maksimal ' + LIMITS.mdbPosMax + '.', 'references');
    if (maxPos > LIMITS.currentMax) add('error', 'mdb-current', '1.7', maxPos + ' DB current; maksimal ' + LIMITS.currentMax + ' sekaligus.', 'references');

    // Teams
    cfg.disciplines.forEach(function (disc, i) {
      if (!disc.active) return;
      if (!disc.team) add('error', 'team-missing', '1.12', 'Disiplin ' + disc.letter + ' belum punya Owning Team.', 'disciplines.' + i + '.team');
    });

    // Groups and slots (project rule: fixed slot capacity per group)
    var cap = cfg.dbNumber.groupCapacity;
    d.disciplines.forEach(function (dd) {
      var path = 'disciplines.' + cfg.disciplines.indexOf(dd.disc);
      if (!dd.display.length) add('warning', 'disc-empty', '', 'Disiplin ' + dd.disc.letter + ' tidak punya item; tidak ada DB/site yang dibuat.', path);
      if (dd.pending) add('info', 'zone-pending', '', 'Disiplin ' + dd.disc.letter + ' belum punya aturan zone (PENDING).', path + '.zones');
    });
    var perGroup = E3D.util.countBy(cfg.items, function (it) { return it.group; });
    cfg.groups.forEach(function (g, i) {
      var n = perGroup.get(g.name) || 0;
      if (!n) add('info', 'group-empty', '', 'Grup ' + g.name + ' kosong; separator grup tidak dibuat.', 'groups.' + i);
      if (cap && n > cap) add('warning', 'group-full', '', 'Grup ' + g.name + ' berisi ' + n + ' item; jatah slot ' + cap + ' (slot ' + g.slotBase + '–' + (g.slotBase + cap - 1) + ').', 'groups.' + i);
      var last = g.slotBase + n - 1;
      if (n && last >= cfg.dbNumber.disciplineStep) add('error', 'slot-overflow', '', 'Grup ' + g.name + ': slot ' + last + ' melewati jatah per disiplin (' + cfg.dbNumber.disciplineStep + ').', 'groups.' + i);
    });

    // Package texts: unknown placeholders and non-ASCII output (encoding in E3D macros not verified)
    if (E3D.macros) {
      var reg = E3D.register ? E3D.register.build(cfg, { date: '2000-01-01' }) : null;
      var pkg = reg ? reg.pkg : E3D.macros.generate(cfg, { date: '2000-01-01' });
      (reg ? reg.missing : pkg.missing).forEach(function (k) {
        add('error', 'placeholder', '', 'Placeholder {' + k + '} tidak dikenal di teks paket/register.', 'texts');
      });
      if (reg && E3D.xlsx && E3D.xlsx.sheetNameProblems) E3D.xlsx.sheetNameProblems(reg.sheets.map(function (s) { return s.name; }))
        .forEach(function (m) { add('error', 'sheet-name', '', m + ' (aturan Excel)', 'register.sheets'); });
      pkg.entries.forEach(function (e) {
        if (!e.dir && /[^\x00-\x7f]/.test(e.text))
          add('warning', 'non-ascii', '§9', e.path + ' berisi karakter non-ASCII; encoding di E3D belum dites (perlu dites).', 'texts');
      });
    }

    // Untested commands used by the package (fact §9)
    if (d.disciplines.some(function (dd) { return dd.zones.some(function (z) { return !z.pending; }); }))
      add('info', 'untested-new-zone', '§9', 'NEW ZONE setelah navigasi ke site belum dites di ZRF (perlu dites).', '');

    return out;

    function checkName(name, kind, path) {
      if (name.charAt(0) !== '/') add('warning', 'name-slash', '3.5', kind + ' ' + name + ' tidak diawali "/".', path);
      if (name !== name.toUpperCase()) add('warning', 'name-case', '3.5', kind + ' ' + name + ' tidak huruf besar.', path);
      else if (!SAFE_NAME.test(name)) add('warning', 'name-chars', '§9', kind + ' ' + name + ' memakai karakter selain huruf, angka dan "-" (perlu dites).', path);
    }
  }

  function push(map, k, v) { if (!map.has(k)) map.set(k, []); map.get(k).push(v); }
  function names(rows) { return rows.map(function (r) { return r.db; }).join(', '); }
  function src(x) { return x.source ? ' (' + x.source + ')' : ''; }
  function dbPath(r) { return 'items.' + r.item.code; }

  // Sorted view used by UIs and reports.
  function summarize(issues) {
    var c = { error: 0, warning: 0, info: 0 };
    issues.forEach(function (i) { c[i.level]++; });
    return c;
  }

  E3D.validate = validate;
  E3D.validateLimits = LIMITS;
  E3D.summarizeIssues = summarize;
})(globalThis.E3D || (globalThis.E3D = {}));

</script>
<script>/* core/macros.js */
/* Macro package text: config + derive() -> ordered list of package entries.
   Formats follow the proven ZRF package (CRLF, "$*" comments, banner headers). */
(function (E3D) {
  'use strict';
  var fmt = E3D.util.fmt;
  var EOL = '\r\n';

  function pad2(n) { return n < 10 ? '0' + n : String(n); }

  // Header template -> comment lines.
  function header(tpl, vars, missing) {
    return fmt(tpl, vars, missing).split('\n').map(function (l) { return l ? '$* ' + l : '$*'; });
  }

  function pendingLine(cfg, line, note, missing) {
    return '$* ' + (note ? fmt(cfg.texts.pendingLine, { LINE: line, NOTE: note }, missing) : line);
  }

  function text(lines) { return lines.join(EOL) + EOL; }

  // Items flagged in fact §9 that this package relies on.
  function untestedItems(d) {
    var out = [];
    if (d.disciplines.some(function (dd) { return dd.zones.some(function (z) { return !z.pending; }); }))
      out.push('NEW ZONE after going to the SITE (fact 9)');
    return out;
  }

  // opts: { date: 'YYYY-MM-DD', only: [discipline letters] | null }
  function generate(cfg, opts) {
    opts = opts || {};
    var d = E3D.derive(cfg), T = cfg.texts, F = T.files, missing = [];
    var discs = d.disciplines;
    var only = opts.only ? new Set(opts.only) : null;
    var nn = function (dd) { return pad2(dd.index + 1); };
    var base = {
      PROJECTCODE: cfg.project.code, PROJECT: cfg.project.name, MDB: cfg.project.mdb,
      MDBNAME: cfg.project.mdb.replace(/^\//, ''), DATE: opts.date || new Date().toISOString().slice(0, 10),
      FIRST: discs.length ? nn(discs[0]) : '', LAST: discs.length ? nn(discs[discs.length - 1]) : '',
      N_DISC: discs.length
    };
    base.TEAMSDIR = fmt(F.teamsDir, base, missing);
    base.REFDIR = fmt(F.refDir, base, missing);
    base.FIXDIR = fmt(F.fixDir, base, missing);
    base.REGISTER = fmt(F.register, base, missing);
    function vars(extra) { return Object.assign({}, base, extra); }

    var entries = [];
    function dir(path) { entries.push({ path: path + '/', dir: true }); }
    function file(path, lines, kind, dd, stats) { entries.push({ path: path, text: text(lines), kind: kind, disc: dd || null, stats: stats || {} }); }

    // README
    var untested = untestedItems(d);
    var unt = untested.length ? fmt(T.untested, { ITEMS: untested.join('; ') }, missing) : '';
    var readme = T.readme.split('\n').filter(function (l) { return !(l.trim() === '{UNTESTED}' && !unt); })
      .map(function (l) { return fmt(l, vars({ UNTESTED: unt }), missing); });
    file(fmt(F.readme, base, missing), readme, 'readme');

    // 00-TEAMS
    var newTeams = discs.filter(function (dd) { return !dd.disc.teamExists; });
    var oldTeams = discs.filter(function (dd) { return dd.disc.teamExists; });
    var t = header(T.headers.teams, base, missing);
    t.push('$* ' + fmt(T.teamsNew, vars({ N: newTeams.length }), missing));
    newTeams.forEach(function (dd) { t.push(createTeam(dd)); });
    newTeams.forEach(function (dd) { if (dd.disc.members.length) t.push('SET TEAM ' + dd.disc.team, 'TADD ' + dd.disc.members.join(' ')); });
    if (oldTeams.length) {
      t.push('$*', '$* ' + fmt(T.teamsExisting, base, missing));
      oldTeams.forEach(function (dd) { t.push('$* ' + createTeam(dd)); });
      oldTeams.forEach(function (dd) {
        if (dd.disc.members.length) t.push('$* SET TEAM ' + dd.disc.team, '$* TADD ' + dd.disc.members.join(' '));
      });
    }
    dir(base.TEAMSDIR);
    file(base.TEAMSDIR + '/' + fmt(F.teams, base, missing), t, 'teams', null, { N_NEW_TEAMS: newTeams.length });

    // Per discipline: B1, B2, B3
    discs.forEach(function (dd) {
      if (only && !only.has(dd.disc.letter)) return;
      var rows = dd.display;
      var v = vars({ NN: nn(dd), D: dd.disc.letter, TEAM: dd.disc.team, DISCIPLINE: dd.disc.name.toUpperCase(),
        Discipline: dd.disc.name, N: rows.length,
        POS_FROM: rows.length ? rows[0].mdbPos : '', POS_TO: rows.length ? rows[rows.length - 1].mdbPos : '' });
      var folder = fmt(F.discDir, v, missing);
      dir(folder);

      var a = cfg.dbAttributes;
      var b1 = header(T.headers.b1, v, missing);
      rows.forEach(function (r) {
        b1.push('CREATE DB ' + r.db + ' ' + a.type + ' ACCESS ' + a.access + ' CLAIM ' + a.claim + ' DBNO ' + r.dbno + " DESC '" + r.desc + "'");
      });
      b1.push('$*', 'SET MDB ' + cfg.project.mdb);
      rows.forEach(function (r) { b1.push('ADD ' + r.db + ' ' + r.mdbPos); });
      file(folder + '/' + fmt(F.b1, v, missing), b1, 'b1', dd, { N_DB: rows.length, POS_FROM: v.POS_FROM, POS_TO: v.POS_TO });

      var b2 = header(T.headers.b2, v, missing), lastDb = null;
      dd.siteOrder.forEach(function (s) {
        b2.push('NEW SITE ' + s.name + (s.row.db !== lastDb ? ' DB ' + s.row.db : ''));
        lastDb = s.row.db;
      });
      b2.push('$*', 'SAVEWORK');
      file(folder + '/' + fmt(F.b2, v, missing), b2, 'b2', dd, { N_SITES: rows.length, N_SEP: dd.siteOrder.length - rows.length });

      var zones = dd.zones.filter(function (z) { return !z.pending; });
      if (zones.length) {
        var b3 = header(T.headers.b3, v, missing), site = null;
        zones.forEach(function (z) {
          if (z.row.site !== site) { if (site) b3.push('$*'); b3.push(z.row.site); site = z.row.site; }
          b3.push('NEW ZONE ' + z.name);
        });
        b3.push('$*', 'SAVEWORK');
        file(folder + '/' + fmt(F.b3, v, missing), b3, 'b3', dd, { N_ZONES: zones.length });
      }
    });

    // 90-REFERENCE
    var refs = d.references, firstRef = refs.find(function (r) { return !r.pending; });
    var rv = vars({ POS_FROM: firstRef ? firstRef.mdbPos : d.mdbCount + 1 });
    var ref = header(T.headers.ref, rv, missing);
    ref.push('SET MDB ' + cfg.project.mdb);
    refs.forEach(function (r) { ref.push(r.pending ? pendingLine(cfg, 'ADD ' + r.db, r.note, missing) : 'ADD ' + r.db + ' ' + r.mdbPos); });
    dir(base.REFDIR);
    file(base.REFDIR + '/' + fmt(F.ref, base, missing), ref, 'ref', null, { POS_FROM: rv.POS_FROM, POS_TO: d.mdbCount });

    // 99-FIXUP: CURRENT for the full final order
    var fix = header(T.headers.fix, base, missing);
    fix.push('SET MDB ' + cfg.project.mdb);
    discs.forEach(function (dd) {
      if (!dd.display.length) return;
      fix.push('$* ' + dd.disc.name);
      dd.display.forEach(function (r) { fix.push('CURRENT ' + r.db + ' ' + r.mdbPos); });
    });
    if (refs.length) {
      fix.push('$* ' + T.fixReferenceLabel);
      refs.forEach(function (r) { fix.push(r.pending ? pendingLine(cfg, 'CURRENT ' + r.db, r.note, missing) : 'CURRENT ' + r.db + ' ' + r.mdbPos); });
    }
    dir(base.FIXDIR);
    file(base.FIXDIR + '/' + fmt(F.fix, base, missing), fix, 'fix', null, { POS_FROM: d.mdbCount ? 1 : 0, POS_TO: d.mdbCount });

    return { root: cfg.project.packageName, entries: entries, derived: d, vars: base, missing: Array.from(new Set(missing)) };

    function createTeam(dd) { return 'CREATE TEAM ' + dd.disc.team + " DESC '" + dd.teamDesc + "'"; }
  }

  // Package entries -> ZIP entries under the root folder (root folder entry first).
  function toZipEntries(pkg, date) {
    var enc = new TextEncoder(), root = pkg.root ? pkg.root + '/' : '';
    var out = root ? [{ name: root, dir: true, date: date }] : [];
    pkg.entries.forEach(function (e) {
      out.push(e.dir ? { name: root + e.path, dir: true, date: date } : { name: root + e.path, data: enc.encode(e.text), date: date });
    });
    return out;
  }

  E3D.macros = { generate: generate, toZipEntries: toZipEntries, EOL: EOL };
})(globalThis.E3D || (globalThis.E3D = {}));

</script>
<script>/* core/register.js */
/* Register workbook content: config -> sheets of cell values (no formatting decisions beyond
   row roles). Sheet list, names, titles and headers come from config.register. */
(function (E3D) {
  'use strict';
  var fmt = E3D.util.fmt;

  // Common placeholders for register texts (titles, headers, text sheets).
  function registerVars(cfg, pkg) {
    var d = pkg.derived, discs = d.disciplines;
    function common(list) { return list.length && list.every(function (x) { return x === list[0]; }) ? list[0] : 'n'; }
    var firstRef = d.references.find(function (r) { return !r.pending; });
    return Object.assign({}, pkg.vars, {
      PACKAGE: cfg.project.packageName,
      N_TEAMS: discs.length,
      N_NEW_TEAMS: discs.filter(function (dd) { return !dd.disc.teamExists; }).length,
      ADMINTEAM: cfg.users.adminTeam.team,
      DB_PER_DISC: common(discs.map(function (dd) { return dd.display.length; })),
      SEP_PER_DISC: common(discs.map(function (dd) { return dd.siteOrder.length - dd.display.length; })),
      REF_FROM: firstRef ? firstRef.mdbPos : '',
      MDB_TOTAL: d.mdbCount,
      N_ZONES: discs.reduce(function (s, dd) { return s + dd.zones.filter(function (z) { return !z.pending; }).length; }, 0),
      DISC_SEQUENCE: discs.map(function (dd) { return pad2(dd.index + 1) + ' ' + dd.disc.letter; }).join(' > ')
    });
  }
  function pad2(n) { return n < 10 ? '0' + n : String(n); }

  // Builds rows for one sheet. Row = { r, cells, role: 'title'|'header'|'data'|'text' }.
  var KINDS = {
    text: function (sh, c) {
      return (sh.rows || []).map(function (row) {
        return { r: row.r, role: row.role || 'text', cells: row.cells.map(function (x) { return typeof x === 'string' ? c.f(x) : x; }) };
      });
    },

    packageFiles: function (sh, c) {
      var tpl = c.cfg.register.packageFiles, n = 0;
      return table(sh, c, c.pkg.entries.filter(function (e) { return !e.dir; }).map(function (e) {
        var slash = e.path.lastIndexOf('/'), t = tpl[e.kind] || { module: '', step: '', content: '' };
        var v = Object.assign({}, c.vars, e.stats, e.disc ? discVars(e.disc) : {});
        return [++n, slash < 0 ? '' : e.path.slice(0, slash), e.path.slice(slash + 1),
          fmt(t.module, v, c.missing), fmt(t.step, v, c.missing), fmt(t.content, v, c.missing)];
      }));
    },

    teams: function (sh, c) {
      var L = c.cfg.register.labels, users = c.cfg.users;
      var rows = c.d.disciplines.map(function (dd) {
        return [dd.disc.team, dd.disc.letter, dd.disc.name, dd.disc.teamDescExisting || dd.teamDesc, dd.display.length,
          dd.disc.teamExists ? L.teamCreated : L.teamToCreate, members(dd.disc.members, L)];
      });
      if (users.adminTeam.team) rows.push([users.adminTeam.team, L.none, users.adminTeam.label, users.adminTeam.description, 0,
        users.adminTeam.exists ? L.teamCreated : L.teamToCreate, members(users.adminTeam.members, L)]);
      if (users.freeUsers.length) rows.push([c.f(L.freeUsersRow), null, null, null, null, null,
        users.freeUsers.map(function (u) { return u.note ? u.name + ' (' + u.note + ')' : u.name; }).join('\n')]);
      var out = table(sh, c, rows), next = out[out.length - 1].r + 2;
      // Status cell tone (green = created, yellow = to create), as in the ZRF register.
      out.forEach(function (row) {
        if (row.role !== 'data') return;
        if (row.cells[5] === L.teamCreated) row.tones = { 5: 'ok' };
        else if (row.cells[5] === L.teamToCreate) row.tones = { 5: 'warn' };
        if (row.cells[1] == null) row.noWidth = true;   // free-users label spans the row
      });
      (sh.notes || []).forEach(function (t, i) { out.push({ r: next + i, role: 'text', cells: [c.f(t)] }); });
      return out;
    },

    dbRegister: function (sh, c) {
      var a = c.cfg.dbAttributes, L = c.cfg.register.labels, n = 0, rows = [];
      c.d.disciplines.forEach(function (dd) {
        dd.register.forEach(function (r) {
          rows.push([++n, dd.disc.name, dd.disc.letter, dd.disc.team, r.item.label, r.item.code, r.func.letter, r.func.name,
            r.db, r.desc, r.dbno, L.fileNo, a.type, a.access, a.claim, r.site, r.item.note]);
        });
      });
      return table(sh, c, rows);
    },

    siteOrder: function (sh, c) {
      var T = c.cfg.register.labels.siteTypes, n = 0, rows = [];
      c.d.disciplines.forEach(function (dd) {
        dd.siteOrder.forEach(function (s) {
          rows.push([++n, dd.disc.name, T[s.type], s.name, s.type === 'site' ? s.row.desc : null, s.row.db, s.row.dbno, s.group]);
        });
      });
      return table(sh, c, rows);
    },

    zones: function (sh, c) {
      var p = c.cfg.pendingZone, n = 0, rows = [];
      c.d.disciplines.forEach(function (dd) {
        dd.zones.forEach(function (z) {
          rows.push(z.pending
            ? [++n, dd.disc.name, dd.disc.letter, z.row.site, p.zone, p.purpose, p.docRef, p.status]
            : [++n, dd.disc.name, dd.disc.letter, z.row.site, z.name, z.purpose, z.docRef, z.status]);
        });
      });
      return table(sh, c, rows);
    },

    codeList: function (sh, c) {
      var list = c.cfg.codeLists[sh.list] || { items: [] };
      var zone = null;
      c.cfg.disciplines.some(function (d) { return d.zones.some(function (z) { if (z.forEach === sh.list) { zone = z; return true; } return false; }); });
      return table(sh, c, list.items.map(function (it, i) {
        return [i + 1, it.code, it.desc, zone ? '/<Site>' + fmt(zone.suffix, { CODE: it.code, DESC: it.desc }) : '', it.note];
      }));
    }
  };

  function members(list, L) { return list.length ? list.join('\n') : L.none; }
  function discVars(dd) {

<script>/* ui/store.js */
/* App state: the config (source of truth), derived data, validation issues and UI state.
   Events: 'render' (full redraw), 'data' (config changed, no redraw of the active view),
   'issues' (validation finished). localStorage holds only the draft and UI preferences. */

  'use strict';
  var ui = E3D.ui = E3D.ui || {};
  var DRAFT_KEY = 'e3d-setup-generator/draft/v1';
  var PREF_KEY = 'e3d-setup-generator/prefs/v1';

  var S = {
    cfg: null, derived: null, issues: [], issuesFor: null, error: null, savedAt: null,
    ui: { mode: 'setup', step: 'project', disc: null, layout: 'group', file: null, sheet: null, only: null, query: '' }
  };
  var listeners = [];
  var validateTimer = null, saveTimer = null;

  function emit(type) { listeners.forEach(function (fn) { fn(type, S); }); }
  function subscribe(fn) { listeners.push(fn); }

  function recompute() {
    S.error = null;
    try {
      var problems = E3D.model.checkStructure(S.cfg);
      S.derived = problems.length ? null : E3D.derive(S.cfg);
      if (problems.length) { S.issues = problems; S.issuesFor = S.cfg; }
    } catch (e) { S.derived = null; S.error = e.message || String(e); }
    if (S.ui.disc && !S.cfg.disciplines.some(function (d) { return d.letter === S.ui.disc; })) S.ui.disc = null;
    if (!S.ui.disc && S.cfg.disciplines.length) S.ui.disc = S.cfg.disciplines[0].letter;
    scheduleValidate();
  }

  function scheduleValidate() {
    clearTimeout(validateTimer);
    validateTimer = setTimeout(function () {
      try { S.issues = S.derived ? E3D.validate(S.cfg, S.derived) : S.issues; }
      catch (e) { S.issues = [{ level: 'error', code: 'internal', fact: '', msg: 'Validasi gagal: ' + (e.message || e), path: '' }]; }
      S.issuesFor = S.cfg;
      emit('issues');
    }, 180);
  }

    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveDraft, 400);
  }
  function saveDraft() {
    try {
      localStorage.setItem(DRAFT_KEY, JSON.stringify({ savedAt: new Date().toISOString(), config: S.cfg }));
      S.savedAt = new Date();
    } catch (e) { S.savedAt = null; }

  function load(cfg) {
    S.cfg = E3D.model.migrate(cfg);
    S.ui.disc = null;
    recompute();
    scheduleSave();
    emit('render');
  }

  // mutate(fn): fn edits S.cfg in place. render=true redraws the active view.
  function mutate(fn, render) {

    D.dialog('Ganti konfigurasi?', h('p', { style: { margin: 0, maxWidth: '420px' } },
      'Konfigurasi sekarang (' + (S.cfg.project.code || 'tanpa kode') + ') akan diganti dengan ' + label +

      [{ label: 'Batal', run: function () {} }, { label: 'Export dulu', run: function () { exportConfig(); return false; } },

      try { store.load(next()); store.setUi({ mode: 'setup', step: 'project' }); D.snack(label + ' dimuat.'); }

<script>/* ui/views/generate.js */

              icon('download'), 'Generate ZIP + XLSX')))) });
